[package]
name = "litebalance-core"
version = "0.1.0"
edition = "2024"
description = "轻衡 (LiteBalance) - 临床级人体代谢动力学与高精度营养计算核心引擎"

[[bin]]
name = "litebalance"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rusqlite = { version = "0.33", features = ["bundled-full", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
csv = "1.3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
